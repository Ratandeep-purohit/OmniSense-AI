[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisense-ai"
version = "0.1.0"
description = "Phase 0 foundation for OmniSense AI"
requires-python = ">=3.11"
dependencies = ["mss>=9,<11"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
