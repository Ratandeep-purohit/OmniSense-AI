[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisense-ai"
version = "0.1.0"
description = "Phase 0 foundation for OmniSense AI"
requires-python = ">=3.11"
dependencies = ["mss>=9,<11"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ocr = ["pytesseract>=0.3,<0.4", "Pillow>=10,<13"]
automation = ["pyautogui>=0.9,<1"]
ui = ["PySide6>=6.8,<7"]

[project.scripts]
omnisense-ui = "omnisense_ai.ui.main:run_ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
